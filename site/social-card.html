<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Source of assets/social.png (1280x640 link preview). Screenshot this page at 1280x640 to regenerate. -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { width: 1280px; height: 640px; overflow: hidden; background: #080808; color: #f4f4f7; font-family: 'Space Grotesk', sans-serif; position: relative; }
    .blob { position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.45; }
    .b1 { width: 700px; height: 700px; background: #6b8f00; top: -380px; left: -200px; }
    .b2 { width: 700px; height: 700px; background: #3b2a8f; bottom: -420px; right: -160px; }
    .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; }
    .brand img { width: 46px; height: 46px; border-radius: 11px; }
    h1 { font-size: 78px; line-height: 0.95; letter-spacing: -0.05em; margin: 30px 0 22px; }
    h1 span { color: #c6ff3d; }
    p { font-size: 25px; color: #a9a9b3; }
    .chips { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
    .chips b { font-weight: 500; font-size: 18px; padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); }
    .shot { position: absolute; right: -150px; top: 70px; width: 820px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 30px 90px -20px rgba(0,0,0,0.9), 0 0 60px -20px rgba(198,255,61,0.45); transform: perspective(1400px) rotateY(-14deg) rotateX(4deg); }
  </style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <img class="shot" src="assets/day.webp" alt="" />
  <div class="left">
    <div class="brand"><img src="assets/icon.png" alt="" />OpenTodo</div>
    <h1>Plan your day, week <span>&amp; month.</span></h1>
    <p>Free &amp; open-source planner. Private by default. Bring your own AI.</p>
    <div class="chips"><b>Windows</b><b>Web</b><b>Ollama</b><b>EN / TR</b></div>
  </div>
</body>
</html>
